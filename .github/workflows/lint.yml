name: Lint

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    paths:
      - '**/*.md'

# 写权限仅用于 push 事件向本仓库分支回推修复。
# 所有 pull_request 事件只提供 artifact 与运行摘要，避免与 push 作业重复回推。
permissions:
  contents: write

env:
  # TODO(供应链安全): 建议固定到具体 tag 或 commit SHA。当前使用分支名以便可用，
  # 但分支内容可随时变化，作为课程仓库应尽快改为不可变引用。
  AUTOCORRECT_REF: main

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: true

      # 供应链安全：先把安装脚本下载到本地并打印，再执行。
      # 不使用 `curl ... | sh`，与本课程 Docker 章节倡导的
      # "下载 → 阅读 → 预览 → 执行"流程中的先检查后执行原则保持一致。
      # 打印脚本不构成来源或完整性校验；不可变引用仍待上方 TODO 落实。
      # 脚本必须放在 $RUNNER_TEMP：放进工作区会被下面的变更检测当成
      # 需要提交的修改，并以 `git add` 提交进仓库。
      - name: Install autocorrect
        run: |
          script="$RUNNER_TEMP/autocorrect-install.sh"
          curl -fsSL -o "$script" \
            "https://raw.githubusercontent.com/huacnlee/autocorrect/${AUTOCORRECT_REF}/install"
          echo "===== 即将执行的安装脚本内容 ====="
          cat "$script"
          echo "================================="
          sh "$script"

      - name: Lint and auto-fix
        continue-on-error: true
        run: |
          autocorrect --fix
          autocorrect --lint

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected. Preparing fixes..."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # 把被修改的文件打包上传，贡献者可以下载后自行提交，
      # 不需要拉取整个仓库（原实现上传了工作区全部内容）。
      - name: Package fixes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git diff --name-only -z | tar --null -T - -czf "$RUNNER_TEMP/autocorrect-fixes.tgz"
          ls -l "$RUNNER_TEMP/autocorrect-fixes.tgz"

      - name: Upload fixes as artifact
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autocorrect-fixes
          path: ${{ runner.temp }}/autocorrect-fixes.tgz
          retention-days: 7

      # 同一提交可能同时触发 push 和 pull_request；只允许 push 作业回推，
      # 防止两次运行从同一提交生成不同修复提交，导致后回推的作业非快进失败。
      # 使用 `git add -u` 而不是 `git add -A`，避免把无关的未跟踪文件带入提交。
      - name: Commit and push fixes
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name == 'push'
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -u
          git commit -m "Auto fix formatting by autocorrect [ci skip]"
          echo "回推到分支: $TARGET_REF"
          git push origin "HEAD:$TARGET_REF"

      # PR 作业不回推；对本仓库与 fork PR 都说明如何获取修复。
      - name: Explain how to apply fixes (PR only)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        run: |
          {
            echo "### autocorrect 发现了格式问题"
            echo ""
            echo "PR 检查只提供修复文件；本仓库分支由对应的 \`push\` 运行负责自动回推。"
            echo "请先刷新并同步 PR 分支，检查修复是否已应用。fork PR 需要贡献者自行提交修复。"
            echo ""
            echo "请下载本次运行的 \`autocorrect-fixes\` artifact 覆盖对应文件，"
            echo "或在仓库根目录执行 \`autocorrect --fix .\` 后重新提交。"
          } >> "$GITHUB_STEP_SUMMARY"
