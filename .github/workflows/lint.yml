name: Lint

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
    paths:
      - '**/*.md'

# 只需要写权限，用于把自动修复回推到**本仓库**分支。
# 来自 fork 的 pull_request 事件拿到的 GITHUB_TOKEN 始终是只读的，
# 因此 fork PR 不做自动回推，改为提供 artifact 与运行摘要。
permissions:
  contents: write

env:
  # TODO(供应链安全): 建议固定到具体 tag 或 commit SHA。当前使用分支名以便可用，
  # 但分支内容可随时变化，作为课程仓库应尽快改为不可变引用。
  AUTOCORRECT_REF: main

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: true

      # 供应链安全：先把安装脚本下载到本地并打印，再执行。
      # 不使用 `curl ... | sh`，与本课程 Docker 章节倡导的
      # "下载 → 阅读 → 校验 → 执行"保持一致。
      # 脚本必须放在 $RUNNER_TEMP：放进工作区会被下面的变更检测当成
      # 需要提交的修改，并以 `git add` 提交进仓库。
      - name: Install autocorrect
        run: |
          script="$RUNNER_TEMP/autocorrect-install.sh"
          curl -fsSL -o "$script" \
            "https://raw.githubusercontent.com/huacnlee/autocorrect/${AUTOCORRECT_REF}/install"
          echo "===== 即将执行的安装脚本内容 ====="
          cat "$script"
          echo "================================="
          sh "$script"

      - name: Lint and auto-fix
        continue-on-error: true
        run: |
          autocorrect --fix
          autocorrect --lint

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected. Preparing to commit..."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # 把被修改的文件打包上传，贡献者可以下载后自行提交，
      # 不需要拉取整个仓库（原实现上传了工作区全部内容）。
      - name: Package fixes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git diff --name-only -z | xargs -0 tar --null -T - -czf "$RUNNER_TEMP/autocorrect-fixes.tgz"
          ls -l "$RUNNER_TEMP/autocorrect-fixes.tgz"

      - name: Upload fixes as artifact
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autocorrect-fixes
          path: ${{ runner.temp }}/autocorrect-fixes.tgz
          retention-days: 7

      # 只有 PR 来自本仓库分支时才可能回推：fork 的 head 分支权限不在本仓库手里。
      # 使用 `git add -u` 而不是 `git add -A`，避免把无关的未跟踪文件带入提交。
      - name: Commit and push fixes (same-repository only)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -u
          git commit -m "Auto fix formatting by autocorrect [ci skip]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      # fork PR：默认 token 既不能推送也不能发表评论，因此在运行摘要中说明如何应用修复。
      - name: Explain how to apply fixes (fork only)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo "### autocorrect 发现了格式问题"
            echo ""
            echo "本 PR 来自 fork。出于安全设计，fork 触发的 \`pull_request\` 事件拿到的"
            echo "\`GITHUB_TOKEN\` 是只读的，工作流既不能回推到你的分支，也不能在这里留言。"
            echo ""
            echo "请下载本次运行的 \`autocorrect-fixes\` artifact 覆盖对应文件，"
            echo "或在仓库根目录执行 \`autocorrect --fix .\` 后重新提交。"
          } >> "$GITHUB_STEP_SUMMARY"
