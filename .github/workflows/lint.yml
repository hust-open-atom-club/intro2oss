name: Lint

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
    paths:
      - '**/*.md'

permissions:
  contents: write
  pull-requests: write

env:
  # TODO(供应链安全): 建议固定到具体 tag 或 commit SHA。当前使用分支名以便可用，
  # 但分支内容可随时变化，作为课程仓库应尽快改为不可变引用。
  AUTOCORRECT_REF: main

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: true

      # 供应链安全：先把安装脚本下载到本地并打印，再执行。
      # 不使用 `curl ... | sh`，与本课程 Docker 章节倡导的
      # "下载 → 阅读 → 校验 → 执行"保持一致。
      - name: Install autocorrect
        run: |
          curl -fsSL -o autocorrect-install.sh \
            "https://raw.githubusercontent.com/huacnlee/autocorrect/${AUTOCORRECT_REF}/install"
          echo "===== 即将执行的安装脚本内容 ====="
          cat autocorrect-install.sh
          echo "================================="
          sh autocorrect-install.sh

      - name: Lint and auto-fix
        continue-on-error: true
        run: |
          autocorrect --fix
          autocorrect --lint

      # 判断本次运行是否产生了自动修复
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected. Preparing to commit..."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # 自动修复产物始终作为 artifact 上传，便于贡献者下载后自行提交。
      - name: Upload fixes as artifact
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autocorrect-fixes
          path: .
          retention-days: 7

      # 仅当 PR 来自本仓库分支时才直接回推；
      # fork PR 的 head 分支无法由本仓库的 GITHUB_TOKEN 推送，
      # 此时走下面的"创建修复 PR"步骤。
      - name: Commit and push fixes (same-repository only)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add -A
          git commit -m "Auto fix formatting by autocorrect [ci skip]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Auto fix formatting by autocorrect [ci skip]"
          branch: auto-fix-${{ github.run_number }}
          delete-branch: true
          title: "Auto fix formatting by autocorrect"
          body: |
            本 PR 由 `autocorrect` 自动生成，用于修正中文排版与格式问题。
            Generated by GitHub Actions run ${{ github.run_number }}.

            你也可以下载本次运行的 `autocorrect-fixes` artifact，在本地提交同样内容的修改。
